<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kerala Drive — World Blockout</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9cbd0;font-family:system-ui,sans-serif}#view{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;left:18px;top:16px;color:#f5f7f2;background:#172629df;border:1px solid #ffffff35;border-radius:12px;padding:12px 16px}
#hud b{font-size:13px;letter-spacing:.14em}#hud small{display:block;margin-top:5px;color:#c5d2cc;font-size:11px}#help{position:fixed;right:18px;bottom:16px;color:#edf3ec;background:#172629d9;border-radius:10px;padding:10px 13px;font-size:11px}
</style></head><body><div id="view"></div><div id="hud"><b>KERALA DRIVE · WORLD BLOCKOUT</b><small>COAST • FARMLAND • GRASSLAND • WESTERN GHATS</small></div><div id="help">DRAG · ORBIT &nbsp; SCROLL · ZOOM &nbsp; RIGHT-DRAG · PAN</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9cbd0);scene.fog=new THREE.Fog(0xa9cbd0,520,1150);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,1800);camera.position.set(520,410,570);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.querySelector('#view').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,18,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=180;controls.maxDistance=1050;
scene.add(new THREE.HemisphereLight(0xe4f4f1,0x65745b,2));const sun=new THREE.DirectionalLight(0xfff0d7,2.5);sun.position.set(-260,430,180);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-520;sun.shadow.camera.right=520;sun.shadow.camera.top=520;sun.shadow.camera.bottom=-520;scene.add(sun);
const mat=(c,r=.9,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const land=mat(0x7f9d61),grassMat=mat(0x729653),sand=mat(0xd8c28e),farm=mat(0x8b9850),farm2=mat(0x9ca45b),wall=mat(0xc8c2ad),cap=mat(0x888477),rock=mat(0x687b68),rock2=mat(0x526957),rock3=mat(0x829178);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,720),land);ground.rotation.x=-Math.PI/2;ground.position.y=-1;ground.receiveShadow=true;scene.add(ground);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(900,1250),new THREE.MeshStandardMaterial({color:0x287f91,roughness:.32,metalness:.08}));sea.rotation.x=-Math.PI/2;sea.position.set(-620,-.9,0);scene.add(sea);
const shallow=new THREE.Mesh(new THREE.PlaneGeometry(170,760),mat(0x62a6a5,.55));shallow.rotation.x=-Math.PI/2;shallow.position.set(-420,-.55,0);scene.add(shallow);
function shoreX(z){return -335+22*Math.sin(z/88)+12*Math.sin(z/37)}
const points=[];for(let i=0;i<=80;i++){let z=-360+i*9;points.push(new THREE.Vector3(shoreX(z),.2,z))}
const curve=new THREE.CatmullRomCurve3(points),pts=curve.getPoints(220),verts=[],idx=[];
for(let i=0;i<pts.length;i++){let p=pts[i],t=curve.getTangent(i/(pts.length-1)),nx=-t.z,nz=t.x;verts.push(p.x+nx*4,.05,p.z+nz*4,p.x+nx*78,.05,p.z+nz*78);if(i<pts.length-1){let a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));bg.setIndex(idx);bg.computeVertexNormals();const beach=new THREE.Mesh(bg,sand);beach.material.side=THREE.DoubleSide;scene.add(beach);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(690,720,90,90),grassMat);grass.rotation.x=-Math.PI/2;grass.position.set(30,.02,0);grass.receiveShadow=true;const p=grass.geometry.attributes.position;for(let i=0;i<p.count;i++){let x=p.getX(i)+30,z=p.getY(i);p.setZ(i,1.8*Math.sin(x*.018)*Math.cos(z*.014)+Math.sin((x+z)*.025))}grass.geometry.computeVertexNormals();scene.add(grass);
function farmPlot(x,z,w,d,alt=false){const plot=new THREE.Mesh(new THREE.BoxGeometry(w,.16,d),alt?farm2:farm);plot.position.set(x,.12,z);scene.add(plot);const bund=mat(0xaaa276);for(const [px,pz,pw,pd] of [[x,z-d/2,w,.8],[x,z+d/2,w,.8],[x-w/2,z,.8,d],[x+w/2,z,.8,d]]){let b=new THREE.Mesh(new THREE.BoxGeometry(pw,.42,pd),bund);b.position.set(px,.26,pz);b.castShadow=true;scene.add(b)}for(let i=1;i<Math.max(3,Math.floor(d/9));i++){let row=new THREE.Mesh(new THREE.BoxGeometry(w-3,.035,.32),mat(alt?0x647b3d:0x5e793b));row.position.set(x,.22,z-d/2+i*d/Math.max(3,Math.floor(d/9)));scene.add(row)}}
[[90,-235,170,105,0],[285,-235,135,105,1],[90,-95,170,100,1],[285,-95,135,100,0],[105,75,190,110,0],[315,85,150,120,1],[120,245,190,105,1],[325,245,145,105,0]].forEach(a=>farmPlot(...a.slice(0,4),!!a[4]));
function mountainRange(bx,bz,n,s,material,seed){for(let i=0;i<n;i++){let x=bx+(i-(n-1)/2)*s*.72,z=bz+Math.sin(i*1.7+seed)*s*.45,h=s*(.42+((i*37+seed*13)%41)/100),r=s*(.34+((i*19+seed)%22)/100);let m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7,3),material);m.position.set(x,h/2-1,z);m.rotation.y=i*.83;m.scale.set(1.15,1,.85);m.castShadow=true;scene.add(m);let hill=new THREE.Mesh(new THREE.SphereGeometry(r*1.2,12,8),rock);hill.scale.y=.42;hill.position.set(x,.2,z);scene.add(hill)}}
mountainRange(530,-240,9,170,rock2,4);mountainRange(570,10,10,205,rock,8);mountainRange(535,260,9,175,rock3,12);mountainRange(680,0,13,255,rock2,20);
// Continuous compound wall enclosing the entire playable land block.
function wallSegment(x1,z1,x2,z2){let dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz),a=Math.atan2(dx,dz);let b=new THREE.Mesh(new THREE.BoxGeometry(2.8,5.5,len+1),wall);b.position.set((x1+x2)/2,2.65,(z1+z2)/2);b.rotation.y=a;b.castShadow=true;b.receiveShadow=true;scene.add(b);let c=new THREE.Mesh(new THREE.BoxGeometry(3.25,.42,len+1.2),cap);c.position.set((x1+x2)/2,5.55,(z1+z2)/2);c.rotation.y=a;scene.add(c)}
const W={l:-390,r:390,n:-315,s:315};wallSegment(W.l,W.n,W.r,W.n);wallSegment(W.r,W.n,W.r,W.s);wallSegment(W.r,W.s,W.l,W.s);wallSegment(W.l,W.s,W.l,W.n);
for(const [x,z] of [[W.l,W.n],[W.r,W.n],[W.r,W.s],[W.l,W.s]]){let q=new THREE.Mesh(new THREE.BoxGeometry(5.5,6.2,5.5),cap);q.position.set(x,2.9,z);q.castShadow=true;scene.add(q)}
function palm(x,z,h=14){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.42,.72,h,7),mat(0x795333));trunk.position.set(x,h/2,z);trunk.castShadow=true;scene.add(trunk);for(let i=0;i<9;i++){let a=i*Math.PI*2/9,leaf=new THREE.Mesh(new THREE.ConeGeometry(1.15,h*.42,5),mat(i%2?0x286b3c:0x347b43));leaf.position.set(x+Math.cos(a)*h*.23,h-1.2,z+Math.sin(a)*h*.23);leaf.rotation.z=Math.PI/2.4;leaf.rotation.y=-a;leaf.scale.set(.42,1,.65);scene.add(leaf)}}
[[-300,-260],[-285,-150],[-310,-25],[-290,110],[-305,250],[-230,-310],[-225,300]].forEach(([x,z],i)=>palm(x,z,13+i%4));
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
