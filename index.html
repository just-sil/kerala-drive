<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kerala Drive — World Blockout</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9cbd0;font-family:system-ui,sans-serif}#view{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;left:18px;top:16px;color:#f5f7f2;background:#172629df;border:1px solid #ffffff35;border-radius:12px;padding:12px 16px}
#hud b{font-size:13px;letter-spacing:.14em}#hud small{display:block;margin-top:5px;color:#c5d2cc;font-size:11px}#help{position:fixed;right:18px;bottom:16px;color:#edf3ec;background:#172629d9;border-radius:10px;padding:10px 13px;font-size:11px}
</style></head><body><div id="view"></div><div id="hud"><b>KERALA DRIVE · WORLD BLOCKOUT</b><small>COAST • FARMLAND • GRASSLAND • WESTERN GHATS</small></div><div id="help">DRAG · ORBIT &nbsp; SCROLL · ZOOM &nbsp; RIGHT-DRAG · PAN</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb8d5d5);
scene.fog=new THREE.Fog(0xb8d5d5,900,1800);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,2500);
camera.position.set(780,690,850);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
document.querySelector('#view').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true;
controls.dampingFactor=.055;
controls.maxPolarAngle=Math.PI*.48;
controls.minDistance=250;
controls.maxDistance=1600;

scene.add(new THREE.HemisphereLight(0xe8f5f1,0x6b7959,1.8));
const sun=new THREE.DirectionalLight(0xffefcf,2.1);
sun.position.set(-300,650,250);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-650;sun.shadow.camera.right=650;
sun.shadow.camera.top=650;sun.shadow.camera.bottom=-650;
scene.add(sun);

const material=(color,roughness=.95)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=material(0x789d59),seaMat=material(0x287f98,.38),shallowMat=material(0x62adb0,.55);
const sand=material(0xd9c79a),paddy1=material(0x9eaa60),paddy2=material(0x82964d);
const bund=material(0xb5a77d),wallMat=material(0xc8c2ad),wallTop=material(0x817e72);
const mountainMats=[material(0x667e69),material(0x748a70),material(0x596f60),material(0x829178)];

// Main land: one continuous, flat terrain slab.
const land=new THREE.Mesh(new THREE.PlaneGeometry(760,640),grass);
land.rotation.x=-Math.PI/2;
land.position.set(40,-1,0);
land.receiveShadow=true;
scene.add(land);

// Arabian Sea to the west, with distinct shallow water and a narrow sandy shore.
function flatRect(w,d,x,z,y,mat){
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);
 m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m;
}
flatRect(600,900,-650,-0,.0,seaMat); // sea ends at x=-350
flatRect(45,680,-327,0,.015,shallowMat);
flatRect(22,640,-294,0,.03,sand);

// Gentle grassy coastal dunes; small smooth mounds, not large mountain-like blobs.
for(let i=0;i<13;i++){
 const z=-285+i*47;
 const dune=new THREE.Mesh(new THREE.SphereGeometry(17,16,10),material(i%2?0x83a567:0x8eaa70));
 dune.scale.set(1.7,.12,1.0);dune.position.set(-265+Math.sin(i*1.4)*9,1,z);
 scene.add(dune);
}

// Farmland blocks on the inland side, separated by visible earthen bunds.
function field(x,z,w,d,alternate=false){
 flatRect(w,d,x,z,.025,alternate?paddy2:paddy1);
 const y=.18,t=.9;
 flatRect(w,t,x,z-d/2,.11,bund);flatRect(w,t,x,z+d/2,.11,bund);
 const left=new THREE.Mesh(new THREE.BoxGeometry(t,.28,d),bund);
 left.position.set(x-w/2,.13,z);scene.add(left);
 const right=left.clone();right.position.x=x+w/2;scene.add(right);
 // Crop rows are fine lines rather than raised solid strips.
 const rowMat=material(alternate?0x657d3c:0x718a43);
 for(let i=1;i<9;i++){
  const row=new THREE.Mesh(new THREE.BoxGeometry(w-5,.018,.22),rowMat);
  row.position.set(x,.065,z-d/2+i*d/9);scene.add(row);
 }
}
field(-105,-205,155,105,false);
field(85,-205,150,105,true);
field(-100,-65,155,105,true);
field(90,-65,150,105,false);
field(-90,95,175,115,false);
field(105,100,160,115,true);
field(-80,255,165,90,true);
field(105,255,160,90,false);

// Low, distant Western Ghats ridge along the eastern horizon.
// Peaks are individually spaced and modest; no giant overlapping spheres.
function peak(x,z,r,h,idx){
 const geo=new THREE.ConeGeometry(r,h,7,2);
 const mesh=new THREE.Mesh(geo,mountainMats[idx%mountainMats.length]);
 mesh.position.set(x,h/2-1,z);
 mesh.rotation.y=idx*.73;
 mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
 // foothill is a low wide mound, kept much smaller than the peak.
 const foot=new THREE.Mesh(new THREE.SphereGeometry(r*.9,14,8),mountainMats[(idx+1)%mountainMats.length]);
 foot.scale.set(1.5,.20,1.0);foot.position.set(x,.1,z);scene.add(foot);
}
const ridge=[
 [270,-310,38,76],[340,-275,48,105],[285,-205,34,70],[365,-145,48,112],
 [285,-70,40,85],[350,5,52,118],[280,85,38,78],[365,155,50,110],
 [285,230,40,88],[345,300,46,100]
];
ridge.forEach((p,i)=>peak(...p,i));

// A clear continuous compound wall around the playable area.
// The coast, farms and foothills all sit INSIDE this perimeter.
const B={left:-365,right:390,north:-325,south:325};
function wallSegment(x1,z1,x2,z2){
 const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz),angle=Math.atan2(dx,dz);
 const body=new THREE.Mesh(new THREE.BoxGeometry(3.2,5.2,len+1),wallMat);
 body.position.set((x1+x2)/2,2.45,(z1+z2)/2);
 body.rotation.y=angle;body.castShadow=true;body.receiveShadow=true;scene.add(body);
 const coping=new THREE.Mesh(new THREE.BoxGeometry(3.7,.38,len+1.2),wallTop);
 coping.position.set((x1+x2)/2,5.15,(z1+z2)/2);
 coping.rotation.y=angle;scene.add(coping);
}
wallSegment(B.left,B.north,B.right,B.north);
wallSegment(B.right,B.north,B.right,B.south);
wallSegment(B.right,B.south,B.left,B.south);
wallSegment(B.left,B.south,B.left,B.north);
for(const [x,z] of [[B.left,B.north],[B.right,B.north],[B.right,B.south],[B.left,B.south]]){
 const pier=new THREE.Mesh(new THREE.BoxGeometry(5,5.8,5),wallTop);
 pier.position.set(x,2.65,z);pier.castShadow=true;scene.add(pier);
}

// Simple coastal palms to communicate the Kerala setting.
const trunkMat=material(0x795333),leafMat=material(0x347b43);
function palm(x,z,h=13){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,h,8),trunkMat);
 trunk.position.set(x,h/2,z);trunk.castShadow=true;scene.add(trunk);
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  const leaf=new THREE.Mesh(new THREE.ConeGeometry(.8,h*.36,5),leafMat);
  leaf.position.set(x+Math.cos(a)*h*.20,h-1.1,z+Math.sin(a)*h*.20);
  leaf.rotation.z=Math.PI/2.5;leaf.rotation.y=-a;
  leaf.scale.set(.35,1,.55);scene.add(leaf);
 }
}
[[-280,-270],[-275,-165],[-280,-45],[-275,85],[-280,210],[-245,300]].forEach(([x,z],i)=>palm(x,z,12+i%3));

function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
